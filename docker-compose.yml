version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adjunct-tracker-backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./backend/alembic:/app/alembic
    environment:
      - APP_NAME=SUSCC Adjunct Tracker
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - API_PREFIX=/api
      - DATABASE_URL=sqlite:///./data/adjunct_tracker.db
      - ALLOWED_ORIGINS=https://adjunct.suscholarsbowl.com,http://localhost:5173
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - SENDER_EMAIL=${SENDER_EMAIL:-noreply@suscc.edu}
      - SENDER_NAME=SUSCC Adjunct Faculty Committee
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@suscc.edu}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-ChangeMe123!}
      - DEFAULT_ADMIN_NAME=System Administrator
    networks:
      - adjunct-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: adjunct-tracker-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - adjunct-network
      - caddy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  adjunct-network:
    driver: bridge
  caddy:
    external: true

volumes:
  backend-data:
