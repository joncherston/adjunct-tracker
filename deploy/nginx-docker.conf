# Nginx configuration for Adjunct Tracker (Docker deployment)
# This config is designed to work alongside other apps on the same server

server {
    listen 80;
    server_name adjunct.suscholarsbowl.com;

    # Logs specific to this app
    access_log /var/log/nginx/adjunct-tracker-access.log;
    error_log /var/log/nginx/adjunct-tracker-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to Docker container
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Max upload size
    client_max_body_size 10M;
}

# HTTPS configuration (will be added by certbot)
# After running: sudo certbot --nginx -d adjunct.suscholarsbowl.com
